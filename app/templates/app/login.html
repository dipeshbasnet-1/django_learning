{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-xl">

    <h1 class="text-4xl font-bold text-center text-gray-800">
        Welcome Back
    </h1>

    <p class="text-center text-gray-500 mt-2 mb-8">
        Sign in to your account to continue.
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-5">
            <label class="block text-sm font-semibold text-gray-700 mb-2">
                Username
            </label>
            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"
            >
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-2">
                Password
            </label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"
            >
        </div>

        <button
            type="submit"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition"
        >
            Login
        </button>

        <p class="text-center text-gray-500 mt-6">
            Don't have an account?
            <a href="{% url 'register_user' %}" class="text-green-600 font-semibold hover:underline">
                Register now
            </a>
        </p>
    </form>

</div>

{% endblock %}
