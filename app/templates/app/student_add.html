{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-100 py-10">
    <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-8">

        <h2 class="text-3xl font-bold text-center text-gray-800 border-b-2 border-black pb-3 mb-8">
            Add Student
        </h2>

        {% comment %} <form action="" method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Name -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Name <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter name"
                    required
                    class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
                >
            </div>

            <!-- Address -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Address <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    name="address"
                    placeholder="Enter address"
                    required
                    class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
                >
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Email <span class="text-red-500">*</span>
                </label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required
                    class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
                >
            </div>

            <!-- Age & Phone -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Age <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="number"
                        name="age"
                        placeholder="Enter age"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Phone Number <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="text"
                        name="phone_number"
                        placeholder="Enter phone number"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
                    >
                </div>

            </div>

            <!-- Department -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Department <span class="text-red-500">*</span>
                </label>

                <select
                    name="department"
                    required
                    class="w-full rounded-lg border border-gray-300 px-4 py-2 bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
                >
                    <option value="" selected disabled>
                        Choose Department
                    </option>

                    {% for dept in departments %}
                        <option value="{{ dept.id }}">
                            {{ dept.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Button -->
            <div class="pt-4">
                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-300"
                >
                    Save Student
                </button>
            </div>

        </form> {% endcomment %}

        <form action="" method="POST">
            {% csrf_token %}
            {{form.as_p}}
            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
                Save 
            </button>
        </form>

    </div>
</div>
{% endblock content %}
